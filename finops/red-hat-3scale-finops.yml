meters:
  - name: subscription_term
    description: Annual 3scale subscription (sized by deployment scope and call volume)
    unit: contract
    aggregation: sum
    dimensions:
      - deployment_model
      - support_level
      - term_length
principles:
  - name: Visibility
    description: 3scale's own analytics service exposes per-application and per-method call
      counts that customers can use for internal showback against the Red Hat subscription cost.
  - name: Allocation
    description: Allocate the 3scale subscription to the platform team that operates the gateway;
      use 3scale account/application metadata to attribute downstream API spend to consumers.
  - name: Optimization
    description: Right-size deployment topology (single vs multi-tenant, OpenShift-native vs
      hosted), consolidate API portfolios behind a shared 3scale instance, and renegotiate term
      length at renewal.
  - name: Accountability
    description: Platform engineering owns the 3scale subscription; product API teams own their
      consumer plan design.
