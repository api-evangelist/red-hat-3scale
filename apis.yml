- aid: red-hat-3scale:webhooks-api
  name: Red Hat 3scale Webhooks
  description: >-
    3scale Webhooks allow API providers to receive real-time HTTP callbacks about account, application,
    user, and plan events within the 3scale platform. Webhooks can be configured to trigger external systems
    when subscriptions change, new developers sign up, applications are updated, or keys are created or
    deleted.
  humanURL: >-
    https://access.redhat.com/documentation/en-us/red_hat_3scale_api_management/2.14/html/admin_portal_guide/webhooks
  tags:
  - API Management
  - Event
  - Notification
  - Webhook
  tags_raw:
  - API Management
