aid: red-hat-3scale
name: Red Hat 3scale
description: >-
  Red Hat 3scale API Management is an enterprise-grade API management platform that enables organizations to share,
  secure, distribute, control, and monetize APIs across internal and external teams. It provides a developer portal,
  analytics, access control, policy enforcement, and billing for REST, SOAP, GraphQL, and other API types. 3scale runs
  on-premises via OpenShift or as a hosted managed service, and is fully Kubernetes-native.
type: Index
