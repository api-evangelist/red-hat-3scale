- aid: red-hat-3scale:toolbox-cli
  name: Red Hat 3scale Toolbox CLI
  description: >-
    The 3scale Toolbox is a command-line interface for automating 3scale configuration tasks. It wraps
    the 3scale Admin REST API to support copying APIs between tenants, promoting configurations between
    staging and production environments, importing OpenAPI specifications, and managing application plans
    and policies from the command line or CI/CD pipelines.
  humanURL: >-
    https://access.redhat.com/documentation/en-us/red_hat_3scale_api_management/2.14/html/operating_3scale/the-threescale-toolbox
  tags:
  - API Management
