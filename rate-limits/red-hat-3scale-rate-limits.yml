specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Red Hat 3scale
providerId: red-hat-3scale
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - API Management
  - Gateway
  - Rate Limiting
description: 3scale is itself an API-management product; rate limits are configured by the customer
  per managed API rather than imposed on consumers of 3scale itself. The Red Hat 3scale product
  page does not publish a platform-wide call ceiling, so the limit values below describe the
  policy shape, not numeric thresholds.
sources:
  - https://www.redhat.com/en/technologies/jboss-middleware/3scale
notes: 3scale enforces customer-defined plans (per-app, per-method, per-time-window). No platform
  ceiling is published; values are set per customer deployment.
responseCodes:
  throttled: 429
limits:
  - name: Customer-defined application plan
    scope: api-key
    metric: varies
    limit: 'configured per application plan in the 3scale admin portal'
  - name: Customer-defined per-method limit
    scope: api-key
    metric: varies
    limit: 'configured per method in the 3scale admin portal'
policies:
  - name: Application Plans
    description: 3scale administrators define application plans with per-app, per-method, and
      per-window limits; consumers of the managed APIs receive 429 responses when those plans
      are exceeded.
  - name: Customer Configuration
    description: All quota and throttling values are set by the 3scale operator, not by Red Hat;
      there is no published platform-wide ceiling.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
