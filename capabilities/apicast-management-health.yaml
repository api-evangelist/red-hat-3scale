  - type: http
    namespace: apicast-management-health
    baseUri: http://localhost:8090
    description: Red Hat 3scale APIcast Management API — Health business capability. Self-contained, no shared references.
    resources:
    - name: status-info
      path: /status/info
      operations:
      - name: getstatusinfo
        method: GET
        description: Get Status Information
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: status-live
      path: /status/live
      operations:
      - name: getliveness
        method: GET
        description: Check Liveness
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: status-ready
      path: /status/ready
      operations:
      - name: getreadiness
        method: GET
        description: Check Readiness
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
